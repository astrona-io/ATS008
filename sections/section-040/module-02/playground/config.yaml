# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Permissions for the Cleanup, Reports and Admission Controllers (PLAYGROUND).
# Status: UNTESTED (written statically, not yet run against a cluster).
#
# A clean sandbox: it starts, installs Kyverno with Helm at default values,
# creates the namespace debris with stale ConfigMaps, and adds the custom
# resource kind Beacon with one object and an Audit-mode policy for it. No
# task, no grading, no `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-008-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8

bootstrap:
  init:
    - name: prepare
      description: "Install Kyverno with Helm, then add the debris namespace, the Beacon custom resource and the beacons-need-owner policy"
      type: file
      source: bootstrap/prepare.sh

teardown:
  keepCluster: false
