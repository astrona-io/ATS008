# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats008-020
course_id: ATS008
exam_code: KCA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: Kyverno Custom Resource Definitions
questions:
- id: ats008-020-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Turn on PolicyException support on the admission controller and name the namespace that is trusted
  source_readings:
  - sections/section-020/module-01/course-02-policy-exceptions.md
  prompt: A team applies a valid `PolicyException` to a default Kyverno install. The exempt Pod is still refused. Which change makes the waiver count?
  options:
  - id: a
    text: Wait a day. Waivers are copied to the admission controller once every 24 hours.
    explanation: This is not the best answer. No such delay exists. The inspectors read policies and waivers live.
  - id: b
    text: Add `--enablePolicyException=true` and `--exceptionNamespace=<namespace>` to the admission controller, and file the waiver in that namespace.
    explanation: Correct. Both flags are needed, and the waiver must live in the trusted namespace.
  - id: c
    text: Move the `PolicyException` into the `kyverno` namespace and remove the policy rule.
    explanation: This is not the best answer. The waiver namespace is chosen by the flag, not fixed to `kyverno`. Removing the rule defeats the purpose of a waiver.
  - id: d
    text: Add `--enablePolicyException=true` to the cleanup controller.
    explanation: This is not the best answer. Waivers are read by the admission controller. The cleanup controller does not evaluate them.
  correct_option: b
  explanation: "`PolicyException` is off by default. Two flags on the admission controller turn it on and limit which namespace may issue waivers."
- id: ats008-020-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Tell the CRDs an author writes from the CRDs Kyverno generates
  source_readings:
  - sections/section-020/module-01/course-01-the-kyverno-crd-map.md
  - sections/section-020/module-01/course-04-generated-crds-reports-and-queues.md
  prompt: Which list contains only objects that you author yourself?
  options:
  - id: a
    text: "`PolicyReport`, `EphemeralReport` and `UpdateRequest`"
    explanation: This is not the best answer. All three are generated by Kyverno controllers.
  - id: b
    text: "`ClusterPolicyReport`, `CleanupPolicy` and `UpdateRequest`"
    explanation: This is not the best answer. `ClusterPolicyReport` and `UpdateRequest` are generated.
  - id: c
    text: "`ClusterPolicy`, `PolicyException` and `CleanupPolicy`"
    explanation: Correct. You write policies, waivers and cleanup rules.
  - id: d
    text: "`ClusterEphemeralReport`, `Policy` and `GlobalContextEntry`"
    explanation: This is not the best answer. `ClusterEphemeralReport` is generated, even though `Policy` and `GlobalContextEntry` are authored.
  correct_option: c
  explanation: Authored kinds are policies, exceptions, cleanup policies and global context entries. Reports and update requests are produced by the controllers.
- id: ats008-020-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the right apiVersion and CRD name for PolicyException on Kyverno v1.13.2
  source_readings:
  - sections/section-020/module-01/course-02-policy-exceptions.md
  prompt: On Kyverno v1.13.2 installed from `install.yaml`, which header is correct for a `PolicyException`?
  options:
  - id: a
    text: "`apiVersion: kyverno.io/v2` and the CRD `policyexceptions.kyverno.io`"
    explanation: Correct. The group is `kyverno.io` and the served version is `v2`.
  - id: b
    text: "`apiVersion: policies.kyverno.io/v1` and the CRD `policyexceptions.policies.kyverno.io`"
    explanation: This is not the best answer. That group holds newer policy kinds, not the `PolicyException` of this release.
  - id: c
    text: "`apiVersion: wgpolicyk8s.io/v1alpha2`"
    explanation: This is not the best answer. That group is used by the report kinds.
  - id: d
    text: "`apiVersion: reports.kyverno.io/v1`"
    explanation: This is not the best answer. That group holds the ephemeral report kinds.
  correct_option: a
  explanation: On v1.13.2 the waiver is `kyverno.io/v2`. Read the served versions with `kubectl get crd policyexceptions.kyverno.io`.
- id: ats008-020-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Name the controller and the report kind that carry intermediate results
  source_readings:
  - sections/section-020/module-01/course-04-generated-crds-reports-and-queues.md
  - sections/section-020/module-03/course-03-background-scans-and-intermediate-reports.md
  prompt: A learner reads an older guide that mentions `AdmissionReport` and `BackgroundScanReport`. Which kinds hold the scratch notes on the releases used in this course?
  options:
  - id: a
    text: "`PolicyReport` and `ClusterPolicyReport`, which are never merged"
    explanation: This is not the best answer. These are the final report cards, not the scratch notes.
  - id: b
    text: "`UpdateRequest`, which queues generate and mutate work"
    explanation: This is not the best answer. That kind is a work queue, not a report.
  - id: c
    text: "`ClusterPolicy`, which stores the results of each rule"
    explanation: This is not the best answer. A policy holds rules, not results.
  - id: d
    text: "`EphemeralReport` and `ClusterEphemeralReport` in `reports.kyverno.io`"
    explanation: Correct. The reports controller merges them into report cards.
  correct_option: d
  explanation: Older releases used `AdmissionReport` and `BackgroundScanReport`. Newer ones use `EphemeralReport` and `ClusterEphemeralReport`.
- id: ats008-020-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Choose between CleanupPolicy and ClusterCleanupPolicy
  source_readings:
  - sections/section-020/module-02/course-01-cleanup-policies-the-salvage-schedule.md
  prompt: A team wants a cleanup rule that works only in the namespace `docking-bay` and runs every minute. What do they write?
  options:
  - id: a
    text: 'A `ClusterCleanupPolicy` with `schedule: "* * * * *"` in `docking-bay`'
    explanation: This is not the best answer. A `ClusterCleanupPolicy` is cluster-scoped and reaches every namespace unless narrowed.
  - id: b
    text: A `ClusterPolicy` with a `cleanup` rule
    explanation: This is not the best answer. A `ClusterPolicy` does not hold cleanup rules.
  - id: c
    text: 'A `CleanupPolicy` in `docking-bay` with `schedule: "* * * * *"` and a `match` block'
    explanation: Correct. A namespaced `CleanupPolicy` stays in its own namespace.
  - id: d
    text: 'A `CleanupPolicy` with `schedule: "1m"`'
    explanation: This is not the best answer. The schedule is a cron expression, not a duration.
  correct_option: c
  explanation: "`CleanupPolicy` is namespaced, `ClusterCleanupPolicy` is cluster-wide. The `schedule` field is a cron expression."
- id: ats008-020-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Use the cleanup.kyverno.io/ttl label to expire an object
  source_readings:
  - sections/section-020/module-02/course-02-the-time-to-live-label.md
  prompt: A ConfigMap must disappear two hours after creation without any cleanup policy. What does the engineer do?
  options:
  - id: a
    text: 'Add the label `cleanup.kyverno.io/ttl: 2h` to the ConfigMap'
    explanation: Correct. The cleanup controller reads the label and deletes the object when the time is up.
  - id: b
    text: 'Add the annotation `kyverno.io/expire: 2h`'
    explanation: This is not the best answer. No annotation of that name exists.
  - id: c
    text: 'Set `spec.ttl: 2h` on the ConfigMap'
    explanation: This is not the best answer. A ConfigMap has no `ttl` field.
  - id: d
    text: 'Create a `PolicyException` with `ttl: 2h`'
    explanation: This is not the best answer. A waiver exempts objects from rules. It does not delete them.
  correct_option: a
  explanation: The label `cleanup.kyverno.io/ttl` takes a duration or a timestamp. The cleanup controller checks it on its reconciliation interval.
- id: ats008-020-q07
  type: single_choice
  difficulty: advanced
  learning_objective: Give the cleanup controller permission to delete the target kind
  source_readings:
  - sections/section-020/module-02/course-03-clearance-for-the-salvage-crew-and-checking-it-ran.md
  prompt: A `CleanupPolicy` for ConfigMaps is accepted, but the ConfigMaps are never removed. The log of the cleanup controller shows a forbidden error. Which fix is correct?
  options:
  - id: a
    text: Restart the admission controller.
    explanation: This is not the best answer. The admission controller does not delete objects for cleanup.
  - id: b
    text: Give the learner `cluster-admin` and apply the policy again.
    explanation: This is not the best answer. The learner is not the one deleting. The cleanup controller service account is.
  - id: c
    text: Raise `--ttlReconciliationInterval` to a larger value.
    explanation: This is not the best answer. This slows the TTL check and does not grant any permission.
  - id: d
    text: 'Create a `ClusterRole` for `configmaps` with `get`, `list`, `watch` and `delete`, labelled `rbac.kyverno.io/aggregate-to-cleanup-controller: "true"`.'
    explanation: Correct. The label aggregates the role into the cleanup controller.
  correct_option: d
  explanation: The cleanup controller has no delete permission for most kinds by default. An aggregate-labelled ClusterRole grants it.
- id: ats008-020-q08
  type: single_choice
  difficulty: intermediate
  learning_objective: Check that a cleanup policy has run
  source_readings:
  - sections/section-020/module-02/course-03-clearance-for-the-salvage-crew-and-checking-it-ran.md
  prompt: Which check shows that a `CleanupPolicy` really ran?
  options:
  - id: a
    text: "`kubectl get policyreport`, which lists every deleted object"
    explanation: This is not the best answer. Reports list validation results, not deletions.
  - id: b
    text: Read `status.lastExecutionTime` on the policy and the log of the cleanup controller
    explanation: Correct. The timestamp and the log show the run.
  - id: c
    text: "`kubectl get clusterpolicy`, which prints the last run"
    explanation: This is not the best answer. A cleanup policy is not a `ClusterPolicy`.
  - id: d
    text: Read the log of the background controller
    explanation: This is not the best answer. The cleanup controller does the work, so its log is the one to read.
  correct_option: b
  explanation: Use `kubectl auth can-i` for permission, `status.lastExecutionTime` for the last run and the cleanup controller log for the detail.
- id: ats008-020-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Explain what Audit and Enforce leave in a report
  source_readings:
  - sections/section-020/module-03/course-01-audit-enforce-and-the-report-kinds.md
  prompt: 'A rule has `failureAction: Enforce`. A Deployment without the required label is created. What happens?'
  options:
  - id: a
    text: It is created, and the report shows `fail`.
    explanation: This is not the best answer. That is the behaviour of `Audit`.
  - id: b
    text: It is created and Kyverno adds the label.
    explanation: This is not the best answer. Adding a label is a `mutate` action, not validation.
  - id: c
    text: The request is refused, no Deployment exists, and the report holds nothing about it.
    explanation: Correct. Reports describe objects that exist.
  - id: d
    text: It is created and removed a minute later.
    explanation: This is not the best answer. Removal is done by cleanup policies, not by `Enforce`.
  correct_option: c
  explanation: "`Audit` records and lets the request through. `Enforce` refuses the request, so no object is created and nothing is reported."
- id: ats008-020-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Choose between PolicyReport and ClusterPolicyReport
  source_readings:
  - sections/section-020/module-03/course-01-audit-enforce-and-the-report-kinds.md
  - sections/section-020/module-03/course-02-reading-results-with-kubectl.md
  prompt: A policy checks Namespaces for an `env` label. Where does the failing result appear?
  options:
  - id: a
    text: In a `ClusterPolicyReport`, because a Namespace is cluster-scoped
    explanation: Correct. Cluster-scoped objects are reported in cluster reports.
  - id: b
    text: In a `PolicyReport` inside the failing Namespace
    explanation: This is not the best answer. A Namespace is cluster-scoped, so its result is not in a namespaced report.
  - id: c
    text: In an `EphemeralReport` that stays for a day
    explanation: This is not the best answer. Scratch notes are merged and deleted quickly.
  - id: d
    text: Nowhere, because Namespaces are never checked
    explanation: This is not the best answer. Namespaces can be matched by a policy.
  correct_option: a
  explanation: "`PolicyReport` covers namespaced objects. `ClusterPolicyReport` covers cluster-scoped ones such as Namespaces."
- id: ats008-020-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the failing objects from a report with JSONPath
  source_readings:
  - sections/section-020/module-03/course-02-reading-results-with-kubectl.md
  prompt: A planet has three Deployments with failed results. One of them fails two rules and the others fail one each. What do the summed `summary.fail` counters of the reports show?
  options:
  - id: a
    text: 3, the number of failing Deployments
    explanation: This is not the best answer. The counters count results, not objects.
  - id: b
    text: 2, the number of rules
    explanation: This is not the best answer. The sum covers all failed results, not a rule count.
  - id: c
    text: 6, because each report is counted twice
    explanation: This is not the best answer. Nothing is counted twice.
  - id: d
    text: 4, the number of failed results
    explanation: Correct. One object can add more than one failed result.
  correct_option: d
  explanation: Each report has its own `summary`. The sum counts failed results, so it can be larger than the number of failing objects.
- id: ats008-020-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Say which controller merges the reports and where the scan interval is set
  source_readings:
  - sections/section-020/module-03/course-03-background-scans-and-intermediate-reports.md
  prompt: 'A policy has `background: true`. Which statement about reports for objects that already exist is correct?'
  options:
  - id: a
    text: The admission controller re-checks them every minute.
    explanation: This is not the best answer. The admission controller handles requests, not the patrol.
  - id: b
    text: The reports controller scans them on the background scan interval, which is one hour by default, and merges the notes into report cards.
    explanation: Correct. `--backgroundScanInterval` sets the interval.
  - id: c
    text: Existing objects are never reported. Only new requests are.
    explanation: This is not the best answer. Background scans exist to cover existing objects.
  - id: d
    text: The cleanup controller writes the reports.
    explanation: This is not the best answer. The cleanup controller removes objects and does not write reports.
  correct_option: b
  explanation: The reports controller runs the background scan, merges `EphemeralReport` notes and keeps the final reports.
