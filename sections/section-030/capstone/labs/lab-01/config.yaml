metadata:
  name: "ats-008-lab-006"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster via Helm at baseline values"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"

validation:
  scripts:
    - name: "admission-flags"
      description: "The admission controller runs with --webhookTimeout=15, --enablePolicyException=true and --exceptionNamespace=capstone-030"
      type: "file"
      source: "validation/validate-admission.sh"
      hint: "The admission controller's map is admissionController.container.extraArgs. Use the flag names without dashes: webhookTimeout, enablePolicyException, exceptionNamespace."
    - name: "cleanup-flags"
      description: "The cleanup controller runs with --ttlReconciliationInterval=5m"
      type: "file"
      source: "validation/validate-cleanup.sh"
      hint: "The cleanup controller's map is cleanupController.extraArgs, with no container level."
