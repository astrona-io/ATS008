metadata:
  name: "ats-008-lab-005"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster via Helm at baseline values"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"

validation:
  scripts:
    - name: "background-gen-workers"
      description: "The background controller runs with --genWorkers=5"
      type: "file"
      source: "validation/validate-background.sh"
      hint: "Set backgroundController.extraArgs.genWorkers=5 with helm upgrade --reuse-values, wait for the rollout and read the Deployment args."
    - name: "reports-scan-interval"
      description: "The reports controller runs with --backgroundScanInterval=30m"
      type: "file"
      source: "validation/validate-reports.sh"
      hint: "Set reportsController.extraArgs.backgroundScanInterval=30m. The reports path has no container level."
