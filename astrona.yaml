  - id: module-040
    title: "Section 040: Configuring Kyverno RBAC, Roles, and Permissions"
    description: >
      Understand Kyverno's per-controller ServiceAccounts, the aggregated
      ClusterRole pattern that assembles their permissions, the built-in
      view role binding, and how to safely extend Kyverno's permissions
      without editing its shipped default roles.

