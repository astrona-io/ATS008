        title: "ClusterRole Aggregation Lab"
        path: sections/section-040/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 20m
        topic: rbac
        task_kind: troubleshooting
        tags: [rbac, clusterrole-aggregation, background-controller, generate-rules, auth-can-i, update-request]
        learning_goals:
          - Find out why a generate rule does not create its ResourceQuota
          - Grant the background controller the missing permission with a new aggregated ClusterRole
          - Prove the next namespace gets its ResourceQuota
