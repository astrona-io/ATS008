# Course manifest for ATS008 - Installation, Configuration, and Upgrades
# (Kyverno Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then the module's landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes next, then the section quiz. The section capstone closes the
# section. Never list solution.md here.
#
# Every `path:` is relative to this file.

training:
  id: ATS008
  title: "KCA: Installation, Configuration, and Upgrades"
  description: >
    Training material covering the Installation, Configuration, and Upgrades
    domain for the Kyverno Certified Associate (KCA) learning path, with
    hands-on labs for each competency running on a kind Kubernetes cluster.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: Kyverno Project (CNCF Sandbox)
    domain: Installation, Configuration, and Upgrades
    weight: 18

modules:
  - id: module-010
    title: "Section 010: Helm-based Installation and Configuration"
    description: >
      Install Kyverno the way most real clusters run it: adding the official
      Helm repo, running a values-driven helm install/upgrade into a
      dedicated namespace, and auditing exactly what got deployed.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Module 1: Installing Kyverno with Helm"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Module 1.1: Adding the Repo & a Baseline Install"
        path: sections/section-010/module-01/course-01-adding-the-repo-and-a-baseline-install.md
      - type: reading
        title: "Module 1.2: Customizing the Install: values.yaml & --set"
        path: sections/section-010/module-01/course-02-customizing-with-values-and-set.md
      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: "Helm Install with Custom Values Lab"
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 15m
        topic: helm-install
        task_kind: build
        tags: [helm, helm-set, dedicated-namespace, admission-controller, replicas, resource-requests]
        learning_goals:
          - Install Kyverno with Helm as release kyverno in its own kyverno namespace
          - Set the admission controller's replicas and resource requests with --set
          - Check the live Deployment to prove the values landed
        resources:
          - name: "Kyverno installation methods"
            url: https://kyverno.io/docs/installation/methods/
          - name: "Kyverno chart values (README)"
            url: https://github.com/kyverno/kyverno/blob/main/charts/kyverno/README.md
          - name: "helm install"
            url: https://helm.sh/docs/helm/helm_install/

      - type: reading
        title: "Section 010 Knowledge Check: Helm-based Installation and Configuration"
        path: sections/section-010/quiz.md

      - type: reading
        title: Question
        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: "Helm-based Installation and Configuration Capstone Lab"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: helm-install
        task_kind: build
        tags: [helm, values-file, controller-toggle, exclude-groups, list-values, replicas]
        learning_goals:
          - Install Kyverno from a values file with helm upgrade --install
          - Turn off the cleanup controller and set the admission controller's replicas
          - Extend a list value without losing the entries you want to keep
        resources:
          - name: "Kyverno installation customization"
            url: https://kyverno.io/docs/installation/customization/
          - name: "Kyverno chart values (README)"
            url: https://github.com/kyverno/kyverno/blob/main/charts/kyverno/README.md
          - name: "helm upgrade"
            url: https://helm.sh/docs/helm/helm_upgrade/

  - id: module-020
    title: "Section 020: Kyverno Custom Resource Definitions (CRDs)"
    description: >
      Go beyond ClusterPolicy and Policy to the full Kyverno CRD surface —
      PolicyException, CleanupPolicy, GlobalContextEntry — and the reporting
      hierarchy behind PolicyReport, from internal admission/background-scan
      reports up to the aggregated, user-facing result.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-020/README.md

      - type: reading
        title: "Module 1: Kyverno's CRD Surface"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Module 1.1: Policy-Authoring CRDs"
        path: sections/section-020/module-01/course-01-policy-authoring-crds.md
      - type: reading
        title: "Module 1.2: Reporting & State CRDs"
        path: sections/section-020/module-01/course-02-reporting-and-state-crds.md
      - type: reading
        title: Question
        path: sections/section-020/module-01/labs/lab-01/question.md
      - type: lab
        title: "PolicyException CRD Lab"
        path: sections/section-020/module-01/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
        topic: crds
        task_kind: build
        tags: [crds, policyexception, admission-controller, controller-flags, kubectl-patch, policy-reports]
        learning_goals:
          - Switch on PolicyException support on a running admission controller
          - Write a PolicyException that exempts exactly one Pod from one rule
          - Prove the exempt Pod is admitted while another Pod is still blocked
        resources:
          - name: "Kyverno policy exceptions"
            url: https://kyverno.io/docs/exceptions/
          - name: "Kyverno policy reports"
            url: https://kyverno.io/docs/policy-reports/

      - type: reading
        title: "Section 020 Knowledge Check: Kyverno Custom Resource Definitions (CRDs)"
        path: sections/section-020/quiz.md

      - type: reading
        title: Question
        path: sections/section-020/capstone/labs/lab-01/question.md
      - type: lab
        title: "Kyverno CRDs Capstone Lab"
        path: sections/section-020/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: crds
        task_kind: build
        tags: [crds, policyexception, clusterpolicy, admission-controller, kubectl-patch]
        learning_goals:
          - Write two PolicyExceptions against two different policies
          - Exempt resources by name and by label selector
          - Prove each exemption works and a control resource is still blocked
        resources:
          - name: "Kyverno policy exceptions"
            url: https://kyverno.io/docs/exceptions/

