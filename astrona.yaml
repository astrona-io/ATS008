  - id: module-050
    title: "Section 050: High Availability Installations"
    description: >
      Learn why "more replicas" means something different for each Kyverno
      controller — the admission controller's stateless horizontal scaling
      versus the background and reports controllers' leader-election
      failover model — and install the documented HA topology.

