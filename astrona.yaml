      - type: lab
        title: "Helm-based Installation and Configuration Capstone Lab"
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced

  - id: module-020
    title: "Section 020: Kyverno Custom Resource Definitions (CRDs)"
    description: >
      Go beyond ClusterPolicy and Policy to the full Kyverno CRD surface —
      PolicyException, CleanupPolicy, GlobalContextEntry — and the reporting
      hierarchy behind PolicyReport, from internal admission/background-scan
      reports up to the aggregated, user-facing result.

    content:
