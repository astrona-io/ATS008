# Course manifest for ATS008 - Installation, Configuration, and Upgrades
# (Kyverno Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then each module's landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes next, then the section quiz. The section capstone closes the
# section. Never list solution.md here.
#
# Every `path:` is relative to this file.

training:
  id: ATS008
  title: "KCA: Installation, Configuration, and Upgrades"
  description: >
    Training material covering the Installation, Configuration, and Upgrades
    domain for the Kyverno Certified Associate (KCA) learning path, with
    hands-on labs for each competency running on a kind Kubernetes cluster.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: Kyverno Project (CNCF Sandbox)
    domain: Installation, Configuration, and Upgrades
    weight: 18

modules:

  - id: module-010
    title: "Section 010: Helm-based Installation and Configuration"
    description: >
      Install Kyverno the way most real clusters run it: adding the official
      Helm repo, running a values-driven helm install/upgrade into a
      dedicated namespace, and auditing exactly what got deployed. Then
      install from the release manifest, and remove Kyverno cleanly without
      leaving webhooks, definitions or a namespace behind.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Module 1: Installing Kyverno with Helm"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Module 1.1: Adding the Repo & a Baseline Install"
        path: sections/section-010/module-01/course-01-adding-the-repo-and-a-baseline-install.md
      - type: reading
        title: "Module 1.2: Customizing the Install: values.yaml & --set"
