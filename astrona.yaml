  - id: module-030
    title: "Section 030: Controller Configuration with Flags"
    description: >
      Tune each of Kyverno's four independent controllers — admission,
      background, cleanup, reports — through their own command-line flags,
      and understand the difference between a live emergency patch and a
      durable Helm extraArgs change.

